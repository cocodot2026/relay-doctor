[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-doctor"
version = "0.1.0"
description = "One-command health check for any OpenAI-compatible AI API / relay. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "cocodot" }]
keywords = ["llm", "openai", "api", "relay", "healthcheck", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/cocodot2026/relay-doctor"
Repository = "https://github.com/cocodot2026/relay-doctor"

[project.scripts]
relay-doctor = "relaydoc:main"

[tool.setuptools]
py-modules = ["relaydoc"]
